[pytest]
python_files = TestSuites_*.py
testpaths = test_suites
addopts = --cache-clear --html=reports/report.html --self-contained-html -v --capture=tee-sys
markers =
    site(name): marks test as being specific to a site (admin, user)
    slow: marks test as slow
    flaky: marks test as flaky/unreliable
    smoke: marks test as part of the smoke test suite
    api: marks test as API test
    ui: marks test as UI test
    regression: marks test as regression test
    integration: marks test as integration test
    env(name): marks test as being specific to an environment (local, uat, prod)
    browser(name): marks test as being specific to a browser (chrome, firefox, edge)